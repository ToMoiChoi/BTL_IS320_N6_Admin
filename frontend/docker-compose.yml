services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btl_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app.db:/app/app.db
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./app.db
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8000
    container_name: btl_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
